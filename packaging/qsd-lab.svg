<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- qcow2 backing chain: three stacked disk layers, newest on top -->
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5aa0ff"/>
      <stop offset="1" stop-color="#2f6fd6"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#dfe8f5" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <g stroke="#1b2a44" stroke-width="3" stroke-linejoin="round">
    <!-- base.qcow2 -->
    <path d="M12 86 L56 106 L100 86 L56 66 Z" fill="#6b7a90"/>
    <path d="M12 86 v8 L56 114 v-8 Z M100 86 v8 L56 114 v-8 Z" fill="#4c586b"/>
    <!-- snapshot -->
    <path d="M12 66 L56 86 L100 66 L56 46 Z" fill="#8e7dd8"/>
    <path d="M12 66 v8 L56 94 v-8 Z M100 66 v8 L56 94 v-8 Z" fill="#6a59b8"/>
    <!-- active top -->
    <path d="M12 46 L56 66 L100 46 L56 26 Z" fill="url(#top)"/>
    <path d="M12 46 v8 L56 74 v-8 Z M100 46 v8 L56 74 v-8 Z" fill="#245aaf"/>
  </g>
  <!-- lab flask -->
  <g stroke="#1b2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <path d="M90 50 v18 L74 100 a6 6 0 0 0 5 9 h36 a6 6 0 0 0 5 -9 L104 68 v-18 Z" fill="url(#glass)"/>
    <path d="M80 92 h34 l6 8 a6 6 0 0 1 -5 9 h-36 a6 6 0 0 1 -5 -9 Z" fill="#45d08a"/>
    <path d="M86 50 h22"/>
  </g>
  <circle cx="92" cy="98" r="2.5" fill="#ffffff"/>
  <circle cx="102" cy="102" r="2" fill="#ffffff"/>
</svg>
